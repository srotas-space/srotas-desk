name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# softprops/action-gh-release needs write access to create the release and
# upload assets — without this, the default GITHUB_TOKEN is read-only
# (repo default since Feb 2023) and the release job fails with a 403.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev libfontconfig1-dev libgtk-3-dev

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x packaging/macos/package.sh
          ./packaging/macos/package.sh
          cd dist/macos && zip -r ../srotas-desk-macos.zip "Srotas Desk.app"

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x packaging/linux/package.sh
          ./packaging/linux/package.sh
          cp dist/linux/srotas-desk-linux.tar.gz dist/

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./packaging/windows/package.ps1
          Copy-Item dist/windows/srotas-desk-windows.zip dist/

      - uses: actions/upload-artifact@v4
        with:
          name: srotas-desk-${{ matrix.name }}
          path: |
            dist/srotas-desk-macos.zip
            dist/srotas-desk-linux.tar.gz
            dist/srotas-desk-windows.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
