[package]
name = "srotas-desk"
version = "1.0.0"
edition = "2024"
description = "Offline inventory and billing for a single hardware shop counter"
homepage = "https://srotas.space"
repository = "https://github.com/srotas-space/srotas-desk"
license-file = "LICENSE"
# Proprietary — this must never be pushed to crates.io, and `publish = false`
# is what makes `cargo publish` refuse rather than rely on remembering.
publish = false

[dependencies]
argon2 = "0.5"
base64 = "0.22"
# Only here to turn on `getrandom`, which is what puts `OsRng` (and so
# `SaltString::generate`) in scope — argon2 pulls password-hash in but has
# no feature of its own that reaches that far.
password-hash = { version = "0.5", features = ["getrandom"] }
chrono = "0.4.45"
dirs = "6.0.0"
ed25519-dalek = "2"
iced = { version = "0.14.0", features = ["tokio", "image", "svg"] }
image = "0.25"
open = "5"
printpdf = "0.7"
rfd = "0.15"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros", "chrono"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }

# Not target-gated: winresource is designed to be a normal build-dependency
# on every host — it checks the *build target* at runtime inside build.rs
# (via CARGO_CFG_TARGET_OS) and only does real work when that's "windows",
# so it's a safe no-op when building for macOS/Linux.
[build-dependencies]
winresource = "0.1"
